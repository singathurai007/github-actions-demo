name: Deploy to EC2

permissions:
  contents: read

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: "DevOps Demo"

jobs:

  build:
    strategy:
      fail-fast: false
      max-parallel: 2

      matrix:
        node-version: [18, 20, 22]
        os: [ubuntu-latest, windows-latest]

        exclude:
          - node-version: 18
            os: windows-latest

        include:
          - node-version: 22
            os: ubuntu-latest
            special: true

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show Node version
        run: node --version

      - name: Install dependencies
        run: npm install

      - name: Run Lint
        run: npx eslint app.js

      - name: Run tests
        run: npm test

      - name: Create build artifact
        run: |
          mkdir -p build
          echo "Build completed successfully" > build/result.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-result-node-${{ matrix.node-version }}-${{ matrix.os }}
          path: build/


  reusable-build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      node-version: "20"


  deploy:
    needs:
      - build
      - reusable-build
    runs-on: ubuntu-latest
    environment: production

    concurrency:
      group: production-deployment
      cancel-in-progress: false

    timeout-minutes: 10

    env:
      APP_NAME: "EC2 Deployment"

    steps:

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check GITHUB_TOKEN
        run: |
          if [ -n "$GITHUB_TOKEN" ]; then
            echo "GITHUB_TOKEN is available"
          else
            echo "GITHUB_TOKEN is missing"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Test write permission
        run: |
          curl -L \
            -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: build-result-*
          path: downloaded-artifacts
          merge-multiple: true

      - name: Show downloaded artifacts
        run: ls -R downloaded-artifacts

      - name: Test environment variable
        env:
          APP_NAME: "Step Deployment"
        run: |
          echo "Shell: $APP_NAME"
          echo "GitHub: ${{ env.APP_NAME }}"

      - name: Debug GitHub context
        run: echo '${{ toJSON(github) }}'

      - name: Show matrix build completed
        run: echo "All matrix build jobs completed successfully!"

      - name: Run Node Test Composite Action
        uses: ./.github/actions/node-test
        with:
          node-version: "20"

      - name: Run Lint
        run: npx eslint app.js

      - name: Always run
        if: always()
        run: echo "This step always runs!"

      - name: Check main branch
        if: contains(github.ref, 'main')
        run: echo "This is the main branch"

      - name: Check branch format
        if: startsWith(github.ref, 'refs/heads/')
        run: echo "This is a branch"

      - name: Check main branch ending
        if: endsWith(github.ref, 'main')
        run: echo "Branch name ends with main"

      - name: Copy website to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "index.html"
          target: "/tmp/"

      - name: Deploy website
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo cp /tmp/index.html /var/www/html/index.html
            sudo systemctl restart nginx
